.nav .lv { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); font-size: .75rem; font-weight: 700; margin-right: 8px; flex: none; }
.nav .on .lv { background: var(--accent); color: var(--surface); }
.nav .cnt { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.sub { margin: 2px 0 6px 30px; }
.sub a { display: flex; gap: 6px; font-size: .88rem; padding: 3px 8px; border-radius: 6px; text-decoration: none; color: var(--text-2); }
.sub a.on { color: var(--accent); font-weight: 500; }
.sub a:hover { background: var(--surface-2); }
.badge { display: inline-block; min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); font-size: .75rem; text-align: center; }
.badge.zero { background: var(--surface-2); color: var(--muted); }
.overall { margin: 22px 8px 0; padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: .85rem; }
.overall b { font-size: 1.2rem; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: .8rem; }
.scrim { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 30; left: 0; top: 0; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.2); }
  .side.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35); }
  .topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; }
  .topbar .t { font-weight: 700; flex: 1; }
  .topbar button { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; }
  .main { padding: 20px 16px 64px; }
}

/* common */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
.eyebrow { font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
.lead { color: var(--text-2); font-size: 1.05rem; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: .85rem; text-decoration: none; color: var(--text); margin: 2px 4px 2px 0; }
.chip.done { border-color: var(--good); color: var(--good); }
.chip.lock { color: var(--muted); }
.lbadge { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); font-size: .78rem; font-weight: 500; }
.btn { display: inline-block; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); text-decoration: none; color: var(--text); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:hover { filter: brightness(.97); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

/* gloss: 새 용어를 그 자리에서 풀어쓰기 */
.gl { font-weight: 500; border-bottom: 1px dashed var(--accent); }
.gl-def { font-weight: 400; color: var(--text-2); font-size: .92em; }
.gl-def::before { content: "("; } .gl-def::after { content: ")"; }
.tlink { font-weight: 500; }

.box { background: var(--surface-2); border-radius: 10px; padding: 12px 16px; margin: 12px 0; font-variant-numeric: tabular-nums; }
.tip { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; color: var(--text-2); margin-top: 1.2em; }
.cap { font-size: .85rem; color: var(--muted); }
table.mini { border-collapse: collapse; width: 100%; font-size: .92rem; font-variant-numeric: tabular-nums; margin: 8px 0; }
table.mini th, table.mini td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: right; }
table.mini th:first-child, table.mini td:first-child { text-align: left; }
table.mini th { color: var(--text-2); font-weight: 500; }
.tablewrap { overflow-x: auto; }

/* tower (용어 체계) */
.tower { display: flex; flex-direction: column; gap: 8px; }
.floor { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
.floor .fl { font-weight: 700; }
.floor .fl small { display: block; font-weight: 400; color: var(--muted); font-size: .78rem; }
@media (max-width: 600px) { .floor { grid-template-columns: 1fr; gap: 4px; } }

/* term list */
.tcard { display: block; text-decoration: none; color: var(--text); }
.tcard h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.state { font-size: .78rem; font-weight: 500; padding: 1px 8px; border-radius: 999px; }
.state.done { background: var(--good-soft); color: var(--good); }
.state.todo { background: var(--surface-2); color: var(--text-2); }
.state.lock { background: var(--surface-2); color: var(--muted); }
.prereq { font-size: .85rem; color: var(--text-2); margin-top: 8px; }
.preview { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
details > summary { cursor: pointer; color: var(--accent); font-weight: 500; }

/* split: 지금은 몰라도 / 수입이 생기면 */
.split > div { border-radius: 12px; padding: 14px 16px; }
.split .later { background: var(--surface-2); }
.split .income { background: var(--accent-soft); }
.split h4 { margin: 0 0 6px; font-size: .95rem; }
.split ul { margin: 0; padding-left: 1.1em; }

/* quiz */
.q { border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; background: var(--surface); }
.q .qh { display: flex; gap: 8px; align-items: baseline; margin-bottom: 10px; }
.q .qn { flex: none; font-weight: 700; color: var(--accent); }
.q .qtag { display: block; font-size: .78rem; color: var(--muted); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 500; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.opt.idk { border-style: dashed; color: var(--muted); }
.fb { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
.fb .res { font-weight: 700; margin-right: 6px; }
.fb .res.ok { color: var(--good); } .fb .res.no { color: var(--bad); }

.locked { position: relative; padding: 28px 20px; text-align: center; border: 1px dashed var(--border); border-radius: 14px; color: var(--muted); }
.locked svg { display: block; margin: 0 auto 8px; }

/* calculator */
.calc { border: 1px solid var(--border); border-radius: 14px; padding: 16px; background: var(--surface); margin: 12px 0; }
.calc .inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.calc label { display: block; font-size: .85rem; color: var(--text-2); }
.calc input[type=number], .calc select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-variant-numeric: tabular-nums; }
.calc input[type=range] { width: 100%; accent-color: var(--accent); }
.calc .chk { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--text); margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0 8px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.tile .k { font-size: .8rem; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.tile .v { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .85rem; color: var(--text-2); margin: 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .ln { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; }
.chart text.end { fill: var(--text-2); font-size: 11.5px; font-weight: 500; }
.tt { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: .82rem; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; display: none; font-variant-numeric: tabular-nums; z-index: 2; }
.tt .r { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tt .r b { margin-left: 12px; }

/* roadmap */
.week { display: grid; grid-template-columns: 56px 1fr; gap: 14px; }
.week .wn { text-align: center; }
.week .wn b { display: block; font-size: 1.4rem; line-height: 1.1; }
.week .wn small { color: var(--muted); font-size: .75rem; }
.week.current { border-color: var(--accent); }
.week.isdone { opacity: .72; }
.week ol { margin: 6px 0 10px; padding-left: 1.2em; }
.doit { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: .95rem; }
.doit b { color: var(--accent); }
.wcheck { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: .9rem; color: var(--text-2); }
.wcheck input { width: 18px; height: 18px; accent-color: var(--accent); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
.footer { margin-top: 40px; font-size: .8rem; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="topbar">
  <button id="menuBtn" aria-label="메뉴 열기">☰</button>
  <span class="t">경제나무</span>
  <a class="badge zero" id="topWrong" href="#/review" title="오답 노트">0</a>
</div>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>

<script>
/* ===================== 저장소 ===================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ===================== 진도 ===================== */
const Progress = (() => {
  const KEY = 'et.progress.v1';
  let s = store.get(KEY, { terms: {}, weeks: {} });
  const save = () => { store.set(KEY, s); App.refreshSide(); };
  return {
    termDone: id => !!s.terms[id],
    setTerm(id) { if (!s.terms[id]) { s.terms[id] = Date.now(); save(); } },
    weekDone: n => !!s.weeks[n],
    setWeek(n, v) { if (v) s.weeks[n] = Date.now(); else delete s.weeks[n]; save(); },
    reset() { s = { terms: {}, weeks: {} }; store.del(KEY); }
  };
})();

/* ===================== 퀴즈 엔진 (재사용 가능) =====================
   QuizEngine.register(questions, meta)   문제 은행에 등록 (meta는 각 문제에 합쳐짐, 예: {termId})
   QuizEngine.mount(el, questions, opts)  문제 묶음을 el에 그림
       opts.mode       'learn' | 'review'   (review면 문항마다 출처 용어 표시)
       opts.onAnswer   (q, ok) => {}
       opts.onComplete (results) => {}      묶음의 모든 문제를 답했을 때
   QuizEngine.wrongIds(filterFn)          현재 오답 문제 id 목록
   QuizEngine.get(id) / isAnswered(id) / onChange(fn) / reset()
   - 틀리면 오답 목록에 추가, 나중에 맞히면 자동으로 빠진다.
   - "잘 모르겠어요"는 오답으로 기록된다(찍지 않은 정직한 답).
   ================================================================= */
const QuizEngine = (() => {
  const KEY = 'et.quiz.v1';
  const bank = {};
  const listeners = [];
  let st = store.get(KEY, { wrong: {}, answered: {} });
  const save = () => { store.set(KEY, st); listeners.forEach(f => f()); };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function record(q, ok) {
    st.answered[q.id] = { ok, at: Date.now() };
    if (ok) delete st.wrong[q.id]; else st.wrong[q.id] = (st.wrong[q.id] || 0) + 1;
    save();
  }

  function mount(el, qs, opts = {}) {
    const fmt = opts.format || (s => s);
    const results = {};
    el.innerHTML = '';
    qs.forEach((q, i) => {
      const card = document.createElement('div');
      card.className = 'q';
      const tag = opts.mode === 'review' && opts.tag ? `<span class="qtag">${opts.tag(q)}</span>` : '';
      card.innerHTML = `<div class="qh"><span class="qn">Q${i + 1}</span><div>${tag}${fmt(q.q)}</div></div><div class="opts"></div>`;
      const box = card.querySelector('.opts');
      const order = shuffle(q.choices.map((c, idx) => idx));
      const buttons = [];
      const answer = picked => {
        const ok = picked === q.answer;
        buttons.forEach(b => {
          b.disabled = true;
          const idx = +b.dataset.idx;
          if (idx === q.answer) b.classList.add('right');
          else if (idx === picked) b.classList.add('wrong');
        });
        const fb = document.createElement('div');
        fb.className = 'fb';
        const label = ok ? '<span class="res ok">정답!</span>' : (picked === -1 ? '<span class="res no">괜찮아요, 지금 배우면 돼요.</span>' : '<span class="res no">아쉬워요.</span>');
        fb.innerHTML = `${label}${fmt(q.explain)}${ok ? '' : '<div class="small muted" style="margin-top:6px">→ 오답 노트에 담았어요. 나중에 다시 나와요.</div>'}`;
        card.appendChild(fb);
        record(q, ok);
        results[q.id] = ok;
        opts.onAnswer && opts.onAnswer(q, ok);
        if (Object.keys(results).length === qs.length) opts.onComplete && opts.onComplete(results);
      };
      order.forEach(idx => {
        const b = document.createElement('button');
        b.className = 'opt'; b.dataset.idx = idx; b.innerHTML = fmt(q.choices[idx]);
        b.onclick = () => answer(idx);
        buttons.push(b); box.appendChild(b);
      });
      const idk = document.createElement('button');
      idk.className = 'opt idk'; idk.dataset.idx = -1; idk.textContent = '잘 모르겠어요';
      idk.onclick = () => answer(-1);
      buttons.push(idk); box.appendChild(idk);
      el.appendChild(card);
    });
  }

  return {
    register(qs, meta = {}) { qs.forEach(q => { bank[q.id] = Object.assign({}, q, meta); }); },
    mount,
    get: id => bank[id],
    isAnswered: id => !!st.answered[id],
    wrongIds: filter => Object.keys(st.wrong).filter(id => bank[id] && (!filter || filter(bank[id]))),
    onChange: fn => listeners.push(fn),
    reset() { st = { wrong: {}, answered: {} }; store.del(KEY); save(); }
  };
})();

/* ===================== 유틸 ===================== */
const TERM = Object.fromEntries(DATA.TERMS.map(t => [t.id, t]));
const LAYER = Object.fromEntries(DATA.LAYERS.map(l => [l.n, l]));
const termsOf = n => DATA.TERMS.filter(t => t.layer === n);
DATA.TERMS.forEach(t => t.quiz && QuizEngine.register(t.quiz, { termId: t.id }));

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rich(s) {
  return String(s)
    .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, '<span class="gl">$1</span><span class="gl-def">$2</span>')
    .replace(/@@(\w+)@@/g, (m, id) => TERM[id] ? `<a class="tlink" href="#/term/${id}">${TERM[id].name}</a>` : m)
    .replace(/\{\{(\w+)\}\}/g, '<div data-widget="$1"></div>');
}
function mountWidgets(root) {
  root.querySelectorAll('[data-widget="calc"]').forEach(el => Calc.mount(el));
}
function fmtKRW(won) {
  won = Math.round(won / 10000) * 10000;
  const eok = Math.floor(won / 1e8), man = Math.round((won % 1e8) / 1e4);
  if (eok && man) return `${eok.toLocaleString()}억 ${man.toLocaleString()}만원`;
  if (eok) return `${eok.toLocaleString()}억원`;
  return `${man.toLocaleString()}만원`;
}
function fmtShort(won) {
  if (won >= 1e8) return (won / 1e8).toFixed(won >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '억';
  return Math.round(won / 1e4).toLocaleString() + '만';
}
const layerStats = n => {
  const ts = termsOf(n), ready = ts.filter(t => t.ready);
  const done = ts.filter(t => Progress.termDone(t.id)).length;
  return { total: ts.length, ready: ready.length, done };
};
const prereqChips = ids => ids.map(id => {
  const t = TERM[id];
  const done = Progress.termDone(id);
  return `<a class="chip ${done ? 'done' : (t.ready ? '' : 'lock')}" href="#/term/${id}">${done ? '✓ ' : ''}${t.name}<span class="muted small">${t.layer}층</span></a>`;
}).join('');
const splitBox = (later, income) => `
  <div class="grid2 split">
    <div class="later"><h4>지금은 몰라도 되는 것</h4><ul>${later.map(x => `<li>${rich(x)}</li>`).join('')}</ul></div>
    <div class="income"><h4>수입이 생기면 바로 할 것</h4><ul>${income.map(x => `<li>${rich(x)}</li>`).join('')}</ul></div>
  </div>`;
const ICON_LOCK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

/* ===================== 복리 계산기 ===================== */
const Calc = (() => {
  const KEY = 'et.calc.v1';
  let uid = 0;
  function compute(p) {
    const P = p.principal * 1e4, r = p.rate / 100, i = p.inflation / 100, f = p.freq;
    const simple = [], comp = [], real = [];
    for (let y = 0; y <= p.years; y++) {
      simple.push(P * (1 + r * y));
      const c = P * Math.pow(1 + r / f, f * y);
      comp.push(c);
      real.push(c / Math.pow(1 + i, y));
    }
    return { P, simple, comp, real };
  }
  function mount(el) {
    const id = 'c' + (++uid);
    const p = Object.assign({}, DATA.CALC_DEFAULT, store.get(KEY, {}));
    el.className = 'calc';
    el.innerHTML = `
      <div class="inputs">
        <div><label for="${id}p">원금 (만원)</label><input id="${id}p" type="number" min="1" step="100" value="${p.principal}"></div>
        <div><label for="${id}r">연 수익률 (%)</label><input id="${id}r" type="number" min="0" max="30" step="0.5" value="${p.rate}"></div>
        <div><label for="${id}y">기간: <b class="yv">${p.years}</b>년</label><input id="${id}y" type="range" min="1" max="50" value="${p.years}"></div>
        <div><label for="${id}f">복리 주기</label><select id="${id}f"><option value="1">1년마다</option><option value="12">매달</option></select></div>
        <div><label for="${id}i">물가상승률 (%)</label><input id="${id}i" type="number" min="0" max="15" step="0.5" value="${p.inflation}">
          <label class="chk"><input type="checkbox" class="real"> 물가 반영 가치 보기</label></div>
      </div>
      <div class="tiles"></div>
      <div class="legend"></div>
      <div class="chart"></div>
      <details style="margin-top:8px"><summary>연도별 표로 보기</summary><div class="tablewrap"></div></details>
      <p class="cap" style="margin:8px 0 0">샘플 계산이에요. 세금·수수료는 빠져 있고, 실제 투자 수익률은 매년 달라요.</p>`;
    const $ = s => el.querySelector(s);
    $(`#${id}f`).value = String(p.freq);
    $('.real').checked = !!p.showReal;
    const read = () => {
      const num = (sel, lo, hi, d) => { const v = parseFloat($(sel).value); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
      p.principal = num(`#${id}p`, 1, 1e7, 1000);
      p.rate = num(`#${id}r`, 0, 30, 7);
      p.years = num(`#${id}y`, 1, 50, 30);
      p.freq = +$(`#${id}f`).value;
      p.inflation = num(`#${id}i`, 0, 15, 2.5);
      p.showReal = $('.real').checked;
      store.set(KEY, p);
      render();
    };
    el.querySelectorAll('input,select').forEach(x => x.addEventListener('input', read));
    function render() {
      $('.yv').textContent = p.years;
      const d = compute(p);
      const n = p.years;
      const dbl = p.rate > 0 ? (72 / p.rate) : null;
      $('.tiles').innerHTML = `
        <div class="tile"><div class="k"><span class="sw" style="background:var(--series-2)"></span>단리 ${n}년 뒤</div><div class="v">${fmtKRW(d.simple[n])}</div></div>
        <div class="tile"><div class="k"><span class="sw" style="background:var(--series-1)"></span>복리 ${n}년 뒤</div><div class="v">${fmtKRW(d.comp[n])}</div></div>
        <div class="tile"><div class="k">복리 − 단리</div><div class="v">${fmtKRW(d.comp[n] - d.simple[n])}</div></div>
        <div class="tile"><div class="k">72의 법칙: 2배까지</div><div class="v">${dbl ? '약 ' + dbl.toFixed(1) + '년' : '—'}</div></div>
        ${p.showReal ? `<div class="tile"><div class="k"><span class="sw" style="background:var(--series-3)"></span>복리, 지금 돈 가치로</div><div class="v">${fmtKRW(d.real[n])}</div></div>` : ''}`;
      const series = [
        { name: '복리', color: 'var(--series-1)', values: d.comp },
        { name: '단리', color: 'var(--series-2)', values: d.simple }
      ];
      if (p.showReal) series.push({ name: '복리(물가 반영)', color: 'var(--series-3)', values: d.real, dash: '6 4' });
      $('.legend').innerHTML = series.map(s => `<span><i class="ln" style="border-color:${s.color};${s.dash ? 'border-top-style:dashed' : ''}"></i>${s.name}</span>`).join('') +
        `<span><i class="ln" style="border-color:var(--muted);border-top-style:dotted"></i>원금</span>`;
      lineChart($('.chart'), { n, series, base: d.P });
      $('.tablewrap').innerHTML = `<table class="mini"><thead><tr><th>연차</th><th>단리</th><th>복리</th>${p.showReal ? '<th>복리(물가 반영)</th>' : ''}</tr></thead><tbody>` +
        d.comp.map((c, y) => `<tr><td>${y}년</td><td>${fmtKRW(d.simple[y])}</td><td>${fmtKRW(c)}</td>${p.showReal ? `<td>${fmtKRW(d.real[y])}</td>` : ''}</tr>`).join('') + '</tbody></table>';
    }
    render();
  }
  return { mount, compute };
})();

/* 선 그래프: 단일 y축, 직접 라벨 + 범례, 십자선 툴팁 */
function lineChart(host, { n, series, base }) {
  const W = Math.max(300, Math.round(host.clientWidth || 640)), H = W < 520 ? 260 : 300;
  const m = { l: 44, r: W < 520 ? 84 : 96, t: 14, b: 30 };
  host._redraw = () => lineChart(host, { n, series, base });
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const max = Math.max(base, ...series.flatMap(s => s.values));
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const k = v / p; return (k <= 1 ? 1 : k <= 2 ? 2 : k <= 5 ? 5 : 10) * p; };
  const step = nice(max / 4), top = Math.ceil(max / step) * step;
  const x = i => m.l + (i / n) * pw, y = v => m.t + ph - (v / top) * ph;
  const path = vals => vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  let g = '';
  for (let v = 0; v <= top + 1; v += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v ? fmtShort(v) : '0'}</text>`;
  const xs = n <= 10 ? (W < 520 ? 2 : 1) : n <= 20 ? 5 : 10;
  for (let i = 0; i <= n; i += xs) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${i}년</text>`;
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(base)}" y2="${y(base)}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
  series.forEach(s => g += `<path d="${path(s.values)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`);
  // 끝 라벨 — 겹치지 않게 최소 간격 확보
  const ends = series.map(s => ({ s, yy: y(s.values[n]) })).sort((a, b) => a.yy - b.yy);
  for (let i = 1; i < ends.length; i++) if (ends[i].yy - ends[i - 1].yy < 26) ends[i].yy = ends[i - 1].yy + 26;
  ends.forEach(e => g += `<circle cx="${x(n)}" cy="${y(e.s.values[n])}" r="3.5" fill="${e.s.color}" stroke="var(--surface)" stroke-width="2"/><text class="end" x="${x(n) + 8}" y="${e.yy}">${e.s.name}</text><text x="${x(n) + 8}" y="${e.yy + 13}">${fmtShort(e.s.values[n])}</text>`);
  g += `<g class="hov" style="display:none"><line class="cx" y1="${m.t}" y2="${m.t + ph}" stroke="var(--muted)" stroke-width="1"/>${series.map(s => `<circle r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('')}</g>`;
  g += `<rect class="hit" x="${m.l - 10}" y="0" width="${pw + 20}" height="${H}" fill="transparent"/>`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="단리와 복리 금액 비교 그래프">${g}</svg><div class="tt"></div>`;
  const svg = host.querySelector('svg'), hov = svg.querySelector('.hov'), tt = host.querySelector('.tt');
  const dots = hov.querySelectorAll('circle'), cx = hov.querySelector('.cx');
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = W / r.width;
    const px = (ev.clientX - r.left) * sx;
    const i = Math.max(0, Math.min(n, Math.round((px - m.l) / pw * n)));
    hov.style.display = '';
    cx.setAttribute('x1', x(i)); cx.setAttribute('x2', x(i));
    series.forEach((s, k) => { dots[k].setAttribute('cx', x(i)); dots[k].setAttribute('cy', y(s.values[i])); });
    tt.innerHTML = `<div style="font-weight:700;margin-bottom:2px">${i}년 뒤</div>` + series.map(s => `<div class="r"><span><span class="sw" style="background:${s.color}"></span> ${s.name}</span><b>${fmtKRW(s.values[i])}</b></div>`).join('');
    tt.style.display = 'block';
    const left = x(i) / sx, w = tt.offsetWidth;
    tt.style.left = Math.max(0, Math.min(r.width - w, left + (left > r.width / 2 ? -w - 12 : 12))) + 'px';
    tt.style.top = '8px';
  };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { hov.style.display = 'none'; tt.style.display = 'none'; });
}

      <nav class="nav">
        <a class="item ${on(!p)}" href="#/">홈 · 용어 체계</a>
        <a class="item ${on(p === 'roadmap')}" href="#/roadmap"><div class="row"><span>12주 로드맵</span><span class="cnt">${weeks}/12</span></div></a>
        <div class="nav-sec">용어 5층</div>
        ${layers}
        <div class="nav-sec">도구</div>
        <a class="item ${on(p === 'calc')}" href="#/calc">복리 계산기</a>
        <a class="item ${on(p === 'review')}" href="#/review"><div class="row"><span>오답 노트</span><span class="badge ${wrong ? '' : 'zero'}">${wrong}</span></div></a>
      </nav>
      <div class="overall">전체 진도<br><b>${doneAll}</b> / ${DATA.TERMS.length} 용어 <span class="muted">(지금 열린 ${ready.length}개)</span>
        <div class="bar"><i style="width:${doneAll / DATA.TERMS.length * 100}%"></i></div>
        <div style="margin-top:10px"><button class="linkbtn" id="resetBtn">진도·오답 초기화</button></div>
      </div>`;
    const tw = document.getElementById('topWrong');
    tw.textContent = wrong; tw.className = 'badge' + (wrong ? '' : ' zero');
    document.getElementById('resetBtn').onclick = () => {
      if (confirm('진도와 오답 기록을 모두 지울까요?')) { Progress.reset(); QuizEngine.reset(); App.route(); }
    };
  },
  openMenu() { document.getElementById('side').classList.add('open'); document.getElementById('scrim').classList.add('open'); },
  closeMenu() { document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
};
QuizEngine.onChange(() => App.refreshSide());
document.getElementById('menuBtn').onclick = App.openMenu;
document.getElementById('scrim').onclick = App.closeMenu;
window.addEventListener('hashchange', App.route);
let rzT, rzW = innerWidth;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => {
  if (innerWidth === rzW) return; rzW = innerWidth;
  document.querySelectorAll('.chart').forEach(c => c._redraw && c._redraw());
}, 150); });
App.route();
</script>
</body>
</html>
